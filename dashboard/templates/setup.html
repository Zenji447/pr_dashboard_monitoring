<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Configuración – PR Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 32px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.3rem; color: #58a6ff; margin-bottom: 24px; }
  h2 { font-size: .95rem; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; margin: 24px 0 12px; border-bottom: 1px solid #21262d; padding-bottom: 6px; }
  label { display: block; font-size: .85rem; color: #8b949e; margin-bottom: 4px; margin-top: 12px; }
  input, select { width: 100%; background: #161b22; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; padding: 8px 10px; font-size: .875rem; }
  input:focus, select:focus { outline: none; border-color: #58a6ff; }
  .ta-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .ta-row input { flex: 1; }
  .btn { cursor: pointer; border: none; border-radius: 6px; padding: 8px 18px; font-size: .875rem; }
  .btn-primary { background: #238636; color: #fff; margin-top: 24px; }
  .btn-primary:hover { background: #2ea043; }
  .btn-sm { background: #21262d; color: #8b949e; padding: 6px 10px; font-size: .8rem; }
  .btn-sm:hover { background: #30363d; }
  .btn-danger { background: #3d1a1a; color: #f85149; }
  #msg { margin-top: 16px; font-size: .875rem; }
  .ok  { color: #3fb950; }
  .err { color: #f85149; }
  a { color: #58a6ff; text-decoration: none; font-size: .85rem; }
</style>
</head>
<body>
<h1>⚙️ Configuración del Dashboard</h1>
<a href="/">← Volver al dashboard</a>

<h2>Provider (repositorio)</h2>
<label>Tipo</label>
<select id="providerType" onchange="toggleProviderFields()">
  <option value="azure_devops">Azure DevOps</option>
  <option value="github">GitHub</option>
  <option value="bitbucket">Bitbucket</option>
</select>

<label>URL de la organización</label>
<input id="orgUrl" placeholder="https://dev.azure.com/MiOrg">

<label>Proyecto</label>
<input id="project" placeholder="MiProyecto">

<label>Repositorio</label>
<input id="repository" placeholder="MiRepo">

<label>Ramas a monitorear (separadas por coma)</label>
<input id="watchedBranches" placeholder="develop, main">

<h2>Notificador (mensajería)</h2>
<label>Tipo</label>
<select id="notifierType">
  <option value="slack">Slack</option>
  <option value="teams">Microsoft Teams</option>
</select>

<label>Token</label>
<input id="notifierToken" type="password" placeholder="xoxp-... / webhook URL">

<label>ID del canal</label>
<input id="channelId" placeholder="C000000000">

<h2>TA Reviewers</h2>
<div id="taList"></div>
<button class="btn btn-sm" onclick="addTA()">+ Agregar TA</button>

<br>
<button class="btn btn-primary" onclick="saveConfig()">💾 Guardar configuración</button>
<div id="msg"></div>

<script>
async function loadConfig() {
  const res = await fetch("/api/config").then(r => r.json());
  if (!res.ok) return;
  const c = res.config;
  document.getElementById("providerType").value    = c.provider?.type || "azure_devops";
  document.getElementById("orgUrl").value          = c.provider?.org_url || "";
  document.getElementById("project").value         = c.provider?.project || "";
  document.getElementById("repository").value      = c.provider?.repository || "";
  document.getElementById("watchedBranches").value = (c.provider?.extra?.watched_branches || []).join(", ");
  document.getElementById("notifierType").value    = c.notifier?.type || "slack";
  document.getElementById("notifierToken").value   = c.notifier?.token || "";
  document.getElementById("channelId").value       = c.notifier?.channel_id || "";
  const ta = c.notifier?.ta_users || {};
  Object.entries(ta).forEach(([name, id]) => addTA(name, id));
}

function addTA(name = "", id = "") {
  const div = document.createElement("div");
  div.className = "ta-row";
  div.innerHTML = `
    <input placeholder="Nombre (lowercase)" value="${name}">
    <input placeholder="User ID (U0000...)" value="${id}">
    <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById("taList").appendChild(div);
}

async function saveConfig() {
  const branches = document.getElementById("watchedBranches").value
    .split(",").map(s => s.trim()).filter(Boolean);

  const ta_users = {};
  document.querySelectorAll("#taList .ta-row").forEach(row => {
    const [nameInput, idInput] = row.querySelectorAll("input");
    if (nameInput.value && idInput.value)
      ta_users[nameInput.value.trim()] = idInput.value.trim();
  });

  const payload = {
    provider: {
      type:       document.getElementById("providerType").value,
      org_url:    document.getElementById("orgUrl").value,
      project:    document.getElementById("project").value,
      repository: document.getElementById("repository").value,
      extra: { watched_branches: branches }
    },
    notifier: {
      type:       document.getElementById("notifierType").value,
      token:      document.getElementById("notifierToken").value,
      channel_id: document.getElementById("channelId").value,
      ta_users
    }
  };

  const res = await fetch("/api/config", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  }).then(r => r.json());

  const msg = document.getElementById("msg");
  if (res.ok) {
    msg.className = "ok"; msg.textContent = "✅ Configuración guardada y aplicada.";
  } else {
    msg.className = "err"; msg.textContent = "Error: " + res.error;
  }
}

loadConfig();
</script>
</body>
</html>
